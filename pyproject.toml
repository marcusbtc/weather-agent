[project]
name = "weather-agent"
version = "0.1.0"
description = "Agent LangGraph com tool de clima (stub) e chat em SSE — Praxis P1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "python-dotenv>=1.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
