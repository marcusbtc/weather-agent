<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Agent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="chat">
      <header class="chat-header">
        <div>
          <h1>Weather Agent</h1>
          <p>LangGraph agent · <code>get_weather</code> tool · SSE</p>
        </div>
      </header>

      <section id="history" class="history" aria-live="polite"></section>

      <form id="chat-form" class="composer" autocomplete="off">
        <input
          id="message"
          name="message"
          type="text"
          placeholder="What's the weather in São Paulo?"
          autofocus
          required
        />
        <label class="graph-toggle">
          <input id="graph-visible" type="checkbox" checked />
          <span class="switch" aria-hidden="true"></span>
          Show graph
        </label>
        <button id="send" type="submit">Send</button>
      </form>
      <section id="graph" class="graph" aria-label="Agent graph"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
