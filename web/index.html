<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LangGraph weather agent with a live event stream." />
    <title>Weather LangGraph Agent</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=28" />
  </head>
  <body>
    <a class="skip-link" href="#message">Skip to message</a>

    <aside id="sidebar" class="sidebar" aria-label="Threads">
      <div class="rail">
        <button id="sidebar-open" type="button" class="menu-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="sidebar-main">
        <div class="sidebar-top">
          <h1>Weather LangGraph Agent</h1>
          <button id="sidebar-close" type="button" class="sidebar-new" aria-label="Close menu">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="sidebar-threads-head">
          <p class="sidebar-label">Threads</p>
          <button id="new-thread" type="button" class="sidebar-new" aria-label="New thread">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <nav id="thread-list" class="thread-list" aria-label="Previous threads"></nav>
      </div>
    </aside>

    <main class="chat">
      <section id="history" class="history" aria-live="polite"></section>

      <form id="chat-form" class="composer" autocomplete="off">
        <label class="visually-hidden" for="message">Message</label>
        <input
          id="message"
          name="message"
          type="text"
          placeholder="What's the weather in São Paulo?"
          autofocus
          required
        />
        <label class="graph-toggle">
          <input id="graph-visible" type="checkbox" checked />
          <span class="switch" aria-hidden="true"></span>
          Show graph
        </label>
        <button id="send" type="submit">
          <svg class="send-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 19V5M5 12l7-7 7 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Send
        </button>
      </form>
      <section id="graph" class="graph" aria-label="Agent graph"></section>
    </main>

    <template id="empty-template">
      <div id="empty" class="empty">
        <h2>Ask a city. Watch the graph move.</h2>
        <div class="empty-asks">
          <button type="button" data-suggest="What's the weather in São Paulo?">
            What's the weather in São Paulo?
          </button>
          <button type="button" data-suggest="How will the week's weather be in São Paulo?">
            How will the week's weather be in São Paulo?
          </button>
          <button type="button" data-suggest="What season is it now in each hemisphere?">
            What season is it now in each hemisphere?
          </button>
        </div>
      </div>
    </template>

    <script type="module" src="./app.js?v=18"></script>
  </body>
</html>
