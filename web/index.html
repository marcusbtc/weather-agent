<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LangGraph weather agent with a live event stream." />
    <title>Weather LangGraph Agent</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20" />
  </head>
  <body>
    <a class="skip-link" href="#message">Skip to message</a>

    <main class="chat">
      <header class="chat-header">
        <h1>Weather LangGraph Agent</h1>
      </header>

      <section id="history" class="history" aria-live="polite"></section>

      <form id="chat-form" class="composer" autocomplete="off">
        <label class="visually-hidden" for="message">Message</label>
        <input
          id="message"
          name="message"
          type="text"
          placeholder="What's the weather in São Paulo?"
          autofocus
          required
        />
        <label class="graph-toggle">
          <input id="graph-visible" type="checkbox" checked />
          <span class="switch" aria-hidden="true"></span>
          Show graph
        </label>
        <button id="send" type="submit">Send</button>
      </form>
      <section id="graph" class="graph" aria-label="Agent graph"></section>
    </main>

    <template id="empty-template">
      <div id="empty" class="empty">
        <h2>Ask a city. Watch the graph move.</h2>
      </div>
    </template>

    <script type="module" src="./app.js?v=12"></script>
  </body>
</html>
